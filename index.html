<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TasteRate – Restaurant Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="site-title">🍽️ Feedback Management System</div>
    <small>Restaurant &amp; Food Reviews</small>
  </header>

  <div class="auth">
    <div class="hero">
      <h1>Rate every bite. Shape every menu.</h1>
      <p>Share ratings and suggestions for your favourite restaurants. Restaurant admins read, reply and improve.</p>
    </div>

    <div class="card box">
      <div class="tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabSignup">Sign up</button>
      </div>
      <p id="msg" class="msg"></p>

      <div id="loginForm">
        <label>Email</label>
        <input id="lEmail" type="email" placeholder="you@example.com">
        <label>Password</label>
        <input id="lPass" type="password" placeholder="Password">
        <button id="loginBtn" style="width:100%">Login</button>
      </div>

      <div id="signupForm" class="hidden">
        <label>Full name</label>
        <input id="sName" placeholder="Your name">
        <label>Email</label>
        <input id="sEmail" type="email" placeholder="you@example.com">
        <label>Password (min 6 characters)</label>
        <input id="sPass" type="password" placeholder="Password">
        <button id="signupBtn" style="width:100%">Create account</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="auth.js"></script>
</body>
</html>
